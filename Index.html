<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidDrop — Pobieracz Wideo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080b10;
      --surface:   #0e1319;
      --border:    #1a2130;
      --border-hi: #2a3a50;
      --accent:    #00d4ff;
      --accent2:   #0066ff;
      --text:      #e8edf5;
      --muted:     #4a5870;
      --success:   #00e5a0;
      --error:     #ff4560;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,102,255,.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 24px;
    }

    /* Header */
    .logo {
      text-align: center;
      margin-bottom: 56px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(0,212,255,.08), rgba(0,102,255,.08));
      border: 1px solid var(--border-hi);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
      margin-bottom: 24px;
    }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }

    .logo-badge span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .logo h1 {
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      margin-top: 12px;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .6;
    }

    /* Platform tabs */
    .platform-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s ease;
    }

    .tab.active {
      border-color: var(--accent);
      background: rgba(0,212,255,.06);
      color: var(--accent);
    }

    .tab:hover:not(.active) {
      border-color: var(--border-hi);
      color: var(--text);
    }

    .tab-icon { font-size: 1rem; }

    /* Input */
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: var(--muted);
      font-size: 1.1rem;
      pointer-events: none;
      transition: color .2s;
    }

    input[type="url"] {
      width: 100%;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 50px 15px 46px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input[type="url"]::placeholder { color: var(--muted); }

    input[type="url"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,.08);
    }

    input[type="url"]:focus + .input-icon-right { opacity: 1; }

    .clear-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      opacity: 0;
      transition: opacity .2s, color .2s;
    }

    .clear-btn.visible { opacity: 1; }
    .clear-btn:hover { color: var(--text); }

    /* Quality selector */
    .quality-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .quality-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
    }

    .quality-btn.active {
      border-color: var(--accent2);
      background: rgba(0,102,255,.1);
      color: #7aa8ff;
    }

    /* Download button */
    .btn-download {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent2), #0099ff);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity .2s, transform .15s;
    }

    .btn-download:hover { opacity: .92; transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }
    .btn-download:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-download::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
      pointer-events: none;
    }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Status */
    .status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status.show { display: flex; }
    .status.loading { background: rgba(0,212,255,.06); border: 1px solid rgba(0,212,255,.2); color: var(--accent); }
    .status.success { background: rgba(0,229,160,.06); border: 1px solid rgba(0,229,160,.2); color: var(--success); }
    .status.error   { background: rgba(255,69,96,.06);  border: 1px solid rgba(255,69,96,.2);  color: var(--error); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,212,255,.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
    }

    .footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
    .footer a:hover { color: var(--accent); border-color: var(--accent); }

    /* Progress bar */
    .progress-wrap {
      margin-top: 14px;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }

    .progress-wrap.show { display: block; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width .3s ease;
    }

    .progress-bar.indeterminate {
      width: 40%;
      animation: indeterminate 1.2s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Download link result */
    .result-box {
      margin-top: 20px;
      padding: 16px 18px;
      background: rgba(0,229,160,.04);
      border: 1px solid rgba(0,229,160,.18);
      border-radius: 12px;
      display: none;
    }

    .result-box.show { display: block; }

    .result-box p {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .result-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-link a {
      color: var(--success);
      font-family: 'JetBrains Mono', monospace;
      font-size: .82rem;
      word-break: break-all;
      text-decoration: none;
    }

    .result-link a:hover { text-decoration: underline; }

    .btn-copy {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0,229,160,.3);
      background: rgba(0,229,160,.08);
      color: var(--success);
      font-family: 'Syne', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
    }

    .btn-copy:hover { background: rgba(0,229,160,.15); }
  </style>
</head>
<body>

<div class="container">
  <header class="logo">
    <div class="logo-badge">
      <div class="logo-dot"></div>
      <span>Video Downloader</span>
    </div>
    <h1>VidDrop</h1>
    <p>Pobierz wideo z X / Twitter w kilka sekund</p>
  </header>

  <div class="card">
    <div class="platform-tabs">
      <button class="tab active" data-platform="x">
        <span class="tab-icon">𝕏</span> X / Twitter
      </button>
      <button class="tab" data-platform="yt" disabled title="Wkrótce">
        <span class="tab-icon">▶</span> YouTube
      </button>
      <button class="tab" data-platform="ig" disabled title="Wkrótce">
        <span class="tab-icon">◈</span> Instagram
      </button>
    </div>

    <div class="input-group">
      <label class="input-label" for="url-input">Link do wideo</label>
      <div class="input-wrap">
        <span class="input-icon">🔗</span>
        <input
          type="url"
          id="url-input"
          placeholder="https://x.com/i/status/..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="clear-btn" id="clear-btn" title="Wyczyść">✕</button>
      </div>
    </div>

    <div class="quality-row">
      <button class="quality-btn" data-q="2160">4K</button>
      <button class="quality-btn" data-q="1440">1440p</button>
      <button class="quality-btn active" data-q="1080">1080p</button>
      <button class="quality-btn" data-q="720">720p</button>
      <button class="quality-btn" data-q="480">480p</button>
      <button class="quality-btn" data-q="360">360p</button>
    </div>

    <button class="btn-download" id="download-btn">
      <span class="btn-inner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.62 2.48A2 2 0 0 0 4.56 21h14.88a2 2 0 0 0 1.94-1.52L22 17"/>
        </svg>
        Pobierz wideo
      </span>
    </button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar indeterminate" id="progress-bar"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="result-box" id="result-box">
      <p>Link do pobrania gotowy — kliknij aby pobrać lub skopiuj adres:</p>
      <div class="result-link">
        <a id="result-link" href="#" target="_blank">—</a>
        <button class="btn-copy" id="copy-btn">Kopiuj</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    Pobieranie działa przez <a href="https://cobalt.tools" target="_blank">cobalt.tools</a> API &mdash;
    używaj zgodnie z prawem autorskim.
  </footer>
</div>

<script>
  const input     = document.getElementById('url-input');
  const clearBtn  = document.getElementById('clear-btn');
  const dlBtn     = document.getElementById('download-btn');
  const statusEl  = document.getElementById('status');
  const progressW = document.getElementById('progress-wrap');
  const resultBox = document.getElementById('result-box');
  const resultLink= document.getElementById('result-link');
  const copyBtn   = document.getElementById('copy-btn');

  let selectedQuality = '1080';

  // Quality buttons
  document.querySelectorAll('.quality-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedQuality = btn.dataset.q;
    });
  });

  // Platform tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.disabled) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });

  // Clear input
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('visible', input.value.length > 0);
    hideResult();
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    hideResult();
    input.focus();
  });

  // Copy button
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resultLink.href).then(() => {
      copyBtn.textContent = 'Skopiowano!';
      setTimeout(() => copyBtn.textContent = 'Kopiuj', 2000);
    });
  });

  function showStatus(type, msg, icon = '') {
    statusEl.className = `status show ${type}`;
    statusEl.innerHTML = type === 'loading'
      ? `<div class="spinner"></div><span>${msg}</span>`
      : `<span>${icon}</span><span>${msg}</span>`;
  }

  function hideResult() {
    resultBox.classList.remove('show');
    statusEl.className = 'status';
    progressW.classList.remove('show');
  }

  // Download
  dlBtn.addEventListener('click', async () => {
    const url = input.value.trim();

    if (!url) {
      showStatus('error', 'Wklej link do wideo.', '⚠️');
      return;
    }

    if (!isValidXUrl(url)) {
      showStatus('error', 'Nierozpoznany link. Upewnij się, że to link z X / Twitter.', '❌');
      return;
    }

    dlBtn.disabled = true;
    resultBox.classList.remove('show');
    progressW.classList.add('show');
    showStatus('loading', 'Pobieram informacje o wideo…');

    try {
      const apiUrl = 'https://api.cobalt.tools/';

      const resp = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          url: url,
          videoQuality: selectedQuality,
          filenameStyle: 'pretty',
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err?.error?.code || `HTTP ${resp.status}`);
      }

      const data = await resp.json();

      progressW.classList.remove('show');

      if (data.status === 'redirect' || data.status === 'stream') {
        const link = data.url;
        resultLink.href = link;
        resultLink.textContent = shortenUrl(link);
        resultBox.classList.add('show');
        showStatus('success', 'Gotowe! Kliknij link aby pobrać wideo.', '✅');

        // Auto-trigger download
        const a = document.createElement('a');
        a.href = link;
        a.download = '';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

      } else if (data.status === 'picker') {
        // Multiple streams (e.g. video + audio)
        const link = data.picker?.[0]?.url || data.audio;
        if (link) {
          resultLink.href = link;
          resultLink.textContent = shortenUrl(link);
          resultBox.classList.add('show');
          showStatus('success', 'Gotowe! Kliknij link aby pobrać wideo.', '✅');
        } else {
          throw new Error('Nie znaleziono strumienia wideo.');
        }
      } else {
        throw new Error(data?.error?.code || 'Nieznana odpowiedź API.');
      }

    } catch (e) {
      progressW.classList.remove('show');
      const msg = friendlyError(e.message);
      showStatus('error', msg, '❌');
    } finally {
      dlBtn.disabled = false;
    }
  });

  function isValidXUrl(url) {
    return /^https?:\/\/(www\.)?(x\.com|twitter\.com)\//.test(url);
  }

  function shortenUrl(url) {
    try {
      const u = new URL(url);
      return u.hostname + u.pathname.slice(0, 40) + '…';
    } catch { return url.slice(0, 50) + '…'; }
  }

  function friendlyError(code) {
    const map = {
      'content.post.unavailable': 'Post niedostępny lub prywatny.',
      'content.video.unavailable': 'Brak wideo w tym poście.',
      'link.unsupported': 'Ten link nie jest obsługiwany.',
      'rate.exceeded': 'Przekroczono limit zapytań. Spróbuj za chwilę.',
      'fetch.fail': 'Nie udało się pobrać danych. Sprawdź link.',
    };
    return map[code] || `Błąd: ${code}`;
  }
</script>
</body>
</html>
